<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — Academia</title>
<link rel="stylesheet" href="assets/css/variables.css" />
<link rel="stylesheet" href="assets/css/global.css" />
<link rel="stylesheet" href="assets/css/components.css" />
<link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body>

<div class="auth-page">
  <section class="auth-visual">
    <div style="width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"/><path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5"/></svg>
    </div>
    <h2>Run your entire school from one modern dashboard.</h2>
    <p style="opacity:.85;font-size:13px;">© 2026 Academia. All schools, one platform.</p>
  </section>

  <section class="auth-form-wrap">
    <form class="auth-form" id="login-form" novalidate>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your school dashboard</p>

      <div class="auth-error-banner" id="login-error"></div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@school.com" required autocomplete="email" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="field-password-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
          <button type="button" id="toggle-password">Show</button>
        </div>
      </div>

      <div class="auth-row">
        <label class="auth-checkbox">
          <input type="checkbox" name="remember" /> Remember me
        </label>
        <a href="forgot-password.html" style="color:var(--primary-dark);font-weight:600;">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="login-submit">Sign In</button>

      <p style="text-align:center;font-size:12px;color:var(--muted);margin-top:20px;">
        Demo access: use any seeded demo account (see README) with password <strong>Password123!</strong>
      </p>
    </form>
  </section>
</div>

<script src="assets/js/utils.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
